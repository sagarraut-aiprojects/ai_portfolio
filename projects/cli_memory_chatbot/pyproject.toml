[project]
name = "cli-memory-chatbot"
version = "0.1.0"
description = "CLI chatbot with persistent conversation memory"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
